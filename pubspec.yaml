name: ezi_download

description: "A modern video downloader application."

publish_to: 'none'

version: 1.0.6+16

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6
  gal: ^2.3.3
  in_app_review: ^2.0.10
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  # Only what the running app draws. The icon and splash sources live in
  # assets/branding/, read by the icon and splash generators at build time,
  # and are deliberately kept out of the APK.
  assets:
    - assets/images/

# Generated by assets/branding/make_icon_assets.py. Android 8+ uses the
# adaptive pair, so the launcher can cut it to a circle or squircle without
# clipping the artwork; older launchers and iOS take the finished icon.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  image_path_ios: "assets/branding/app_icon_ios.png"
  adaptive_icon_background: "assets/branding/icon_bg.png"
  adaptive_icon_foreground: "assets/branding/icon_fg.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#07132D"
  image: "assets/branding/splash.png"

  # Android 12+ masks the splash icon to a circle, so it needs a padded copy
  # with the artwork inside the safe area.
  android_12:
    color: "#07132D"
    image: "assets/branding/splash_android12.png"