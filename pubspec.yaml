name: ezi_download

description: "A modern video downloader application."

publish_to: 'none'

version: 1.0.1+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  # Only what the running app draws. The icon and splash sources live in
  # assets/branding/, read by the icon and splash generators at build time,
  # and are deliberately kept out of the APK.
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#07132D"
  image: "assets/branding/splash.png"

  # Android 12+ masks the splash icon to a circle, so it needs a padded copy
  # with the artwork inside the safe area.
  android_12:
    color: "#07132D"
    image: "assets/branding/splash_android12.png"