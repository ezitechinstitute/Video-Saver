name: ezi_download

description: "A modern video downloader application."

publish_to: 'none'

version: 1.0.0+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/home.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#07132D"
  image: "assets/images/splash.png"

  android_12:
    color: "#07132D"
    image: "assets/images/splash.png"